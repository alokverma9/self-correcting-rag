services:
  - type: web
    name: corrective-rag-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: corrective-rag-db
          property: connectionString
      - key: GOOGLEAI_STUDIO_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite

databases:
  - name: corrective-rag-db
    plan: free
    postgresMajorVersion: 16
