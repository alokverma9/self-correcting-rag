services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: corrective_rag_pgvector
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: corrective_rag
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d corrective_rag"]
      interval: 5s
      timeout: 5s
      retries: 5
